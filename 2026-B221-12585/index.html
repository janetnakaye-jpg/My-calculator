<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" value="0">
    
    <div class="buttons">
    <button class="janet sd">AC</button>
    <button class="janet">00</button>
    <button class="janet">%</button>
    <button class="janet" id="kk">/</button>
    </div>

    <div>
    <button class="janet">7</button>
    <button class="janet">8</button>
    <button class="janet">9</button>
    <button class="janet" id="kk">X</button>
    </div>

    <div>
    <button class="janet">4</button>
    <button class="janet">5</button>
    <button class="janet">6</button>
    <button class="janet" id="kk">-</button>
    </div>

    <div>
    <button class="janet">1</button>
    <button class="janet">2</button>
    <button class="janet">3</button>
    <button class="janet" id="kk">+</button>
    </div>

    <div>
    <button class="janet nads">0</button>
    <button class="janet">.</button>
    <button class="janet" id="kk">=</button>
    </div>

    </div>
</body>
</html>
